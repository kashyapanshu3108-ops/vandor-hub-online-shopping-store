<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VendorHub — Hyperlocal Multi-Vendor Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
    <path d="M20 7H4C2.9 7 2 7.9 2 9v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM9 4h6v3H9V4z"/> -->
          <circle cx="8" cy="14" r="2"/>
          <path d="M12 14h4"/>
        </svg>
      </div>
      <div class="logo-text">Vendor<span>Hub</span></div>
    </div>
<!-- // role switcher -->
 <div style="padding:12px 12px 8px;">
      <div class="role-label">Switch Role</div>
      <div style="display:flex;flex-direction:column;gap:3px;">
 
        <button class="role-btn active" onclick="switchRole('buyer')" id="role-buyer">
          <div class="role-icon">🛍️</div>
          <div>
            <div>Buyer</div>
            <div style="font-size:10px;opacity:0.7;font-weight:400;">Rahul Sharma</div>
          </div>
        </button>
 
        <button class="role-btn" onclick="switchRole('seller')" id="role-seller">
          <div class="role-icon">🏪</div>
          <div>
            <div>Seller</div>
            <div style="font-size:10px;opacity:0.7;font-weight:400;">TechZone Store</div>
          </div>
        </button>
 
        <button class="role-btn" onclick="switchRole('admin')" id="role-admin">
          <div class="role-icon">⚙️</div>
          <div>
            <div>Admin</div>
            <div style="font-size:10px;opacity:0.7;font-weight:400;">Platform Admin</div>
          </div>
        </button>
 
      </div>
    </div>
<!-- nav -->
<nav class="nav" id="nav"></nav>
 
    <!-- User -->
    <div class="user-bar">
      <div class="user-card">
        <div class="avatar" id="user-avatar" style="background:var(--brand);">AK</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Anshu kashyap</div>
          <div class="user-role" id="user-role">Buyer Account</div>
        </div>
      </div>
    </div>
</aside>

<!-- /sidebar -->
 
 
  <!-- ═══════════════════════════════════════════
       MAIN
  ════════════════════════════════════════════ -->
  <div class="main">
 
    <!-- Topbar -->
    <div class="topbar">
      <div class="search-bar" style="flex:1;max-width:460px;">
        <span style="font-size:15px;">🔍</span>
        <input type="text" id="search-input" placeholder="Search products, vendors…" oninput="handleSearch(this.value)">
        <span class="ai-tag">AI</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="togglePanel('cart-panel')" title="Cart">
          🛒<span class="badge-dot" id="cart-dot" style="display:none"></span>
        </button>
        <button class="icon-btn" onclick="togglePanel('wish-panel')" title="Wishlist">❤️</button>
        <button class="icon-btn" onclick="showNotifications()" title="Notifications">
          🔔<span class="badge-dot"></span>
        </button>
        <div class="avatar" id="topbar-avatar"
             style="background:var(--brand);cursor:pointer;width:32px;height:32px;font-size:12px;">AK</div>
      </div>
    </div>

















 </head>
<body>
